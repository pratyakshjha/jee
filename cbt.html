const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const stamp=()=>new Date().toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const shortDate=ts=>new Date(ts).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});

2. AUTOMATIC SECTION SCORING IS REQUIRED. Read the paper's instructions, section headings, and marking notes. Put the marking rule in this JSON; the user must not have to manually configure sections in the website. Every question needs an exact 'section' name. Use that exact name as a key in top-level 'sectionScoring'. For every section whose scoring differs, set its 'correct', 'wrong', and 'unattempted' values and, where applicable, its 'multipleCorrect' rule. If a rule truly applies to all sections, it may live in top-level 'scoring'. Use 'scoring' for the usual marks when a section does not have different marks listed. Do not collapse different schemes into one global rule.

 const byPage=new Map();for(const item of wanted){if(item.region.page>pdf.numPages)throw new Error(`Q${item.qi+1}: diagram page ${item.region.page} exceeds this PDF's ${pdf.numPages} pages.`);if(!byPage.has(item.region.page))byPage.set(item.region.page,[]);byPage.get(item.region.page).push(item)}

 for(const [pageNo,items] of [...byPage.entries()].sort((a,b)=>a[0]-b[0])){
  const page=await pdf.getPage(pageNo),viewport=page.getViewport({scale:2});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;
  for(const item of items){const box=item.region.box;const x0=Math.max(0,Math.floor(box[0]/1000*canvas.width)),y0=Math.max(0,Math.floor(box[1]/1000*canvas.height)),x1=Math.min(canvas.width,Math.ceil(box[2]/1000*canvas.width)),y1=Math.min(canvas.height,Math.ceil(box[3]/1000*canvas.height));if(x1-x0<4||y1-y0<4)throw new Error(`Q${item.qi+1}: diagram crop is too small; check its box coordinates.`);const out=document.createElement('canvas');out.width=x1-x0;out.height=y1-y0;const octx=out.getContext('2d');octx.fillStyle='#fff';octx.fillRect(0,0,out.width,out.height);octx.drawImage(canvas,x0,y0,out.width,out.height,0,0,out.width,out.height);item.q.diagramAssets=[...(item.q.diagramAssets||[]),{target:item.region.target||'question',src:out.toDataURL('image/webp',0.88)}];out.width=out.height=0;done++;const status=$('#validation');if(status)status.innerHTML=`<div class="card"><b>Auto-cropping diagrams…</b><p class="muted small" style="margin:6px 0 0">${done} of ${wanted.length} figures cropped (page ${pageNo}).</p></div>`}

async function validateImport(){
 try{const v=normalizePaper(parseSource($('#source').value));if(v.errors.length){showValidation(v);return}const hasRegions=v.paper.questions.some(q=>q.diagramRegions.length);const file=$('#source-pdf')?.files?.[0];if(hasRegions&&!file){v.errors.push('Attach the original PDF to auto-crop the diagrams specified by diagramRegions.');showValidation(v);return}if(hasRegions){$('#validation').innerHTML='<div class="card"><b>Reading PDF and cropping figures…</b><p class="muted small">Processing happens in this browser; the PDF is not uploaded to a server.</p></div>';await cropPdfDiagramRegions(v.paper,file)}showValidation(v)}catch(e){showValidation({errors:[e.message||String(e)],warnings:[]})}

function markingSummary(paper){
 const names=[...new Set((paper.questions||[]).map(q=>String(q.section||'General')))];
 const show=v=>v===null||v===undefined?'unspecified':fmtMark(v);
 const rows=names.map(name=>{
  const qs=paper.questions.filter(q=>String(q.section||'General')===name),cfg=paper.sectionScoring?.[name]||{},first=qs[0]||{section:name},eff=effectiveScoring(paper,first);
  const hasSection=Object.keys(cfg).some(k=>k==='multipleCorrect'?cfg.multipleCorrect&&Object.values(cfg.multipleCorrect).some(v=>v!==null&&v!==undefined):cfg[k]!==null&&cfg[k]!==undefined);
  let multi='—';
  if(qs.some(q=>q.type==='multiple')){
   const explicitMode=cfg.multipleCorrect?.mode,mode=eff.multipleCorrect.mode,src=explicitMode?'section rule':'default marks';
   if(mode==='subset-with-penalty')multi=`${markingModeLabel(mode)} (${show(eff.multipleCorrect.partialCorrect)} per correct pick; any wrong pick ${fmtMark(eff.wrong)} once; exact set ${fmtMark(eff.correct)}) · ${src}`;
   else if(mode==='per-option')multi=`Per correct ${show(eff.multipleCorrect.partialCorrect)}, per wrong ${show(eff.multipleCorrect.partialWrong)} · ${src}`;
   else multi=`${markingModeLabel(mode)} · ${src}`;
  }
  const val=(k)=>typeof cfg[k]==='number'?fmtMark(cfg[k]):`${fmtMark(paper.scoring[k])} (default marks)`;
  return `<tr><td>${esc(name)}</td><td>${val('correct')}</td><td>${val('wrong')}</td><td>${val('unattempted')}</td><td>${multi}</td><td>${hasSection?'<span class="green">Section rule imported</span>':'<span class="muted">Default marks</span>'}</td></tr>`;
 }).join('');
 return `<div class="card" style="margin-top:12px"><div class="row"><h3 class="spacer" style="margin:0">Marking rules applied automatically</h3><span class="badge">${names.length} sections</span></div><p class="small muted" style="margin:8px 0">These rules come from the AI-generated JSON. You do not need to configure sections manually. Check this summary and use the optional editor only if the AI extracted a rule incorrectly.</p><div style="overflow-x:auto"><table class="content-table"><thead><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Multiple-correct rule</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function showValidation(v){window._validated=null;const target=$('#validation');if(v.errors.length){target.innerHTML=`<div class="notice" style="border-color:#a94e55;background:#351d22;color:#ffc0c4"><b>Validation failed</b><ul>${v.errors.slice(0,14).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;return}window._validated=v.paper;target.innerHTML=`<div class="card" style="padding:13px;border-color:#32865e"><h3 class="green">Code is valid</h3><div class="row"><span class="badge">${v.paper.questions.length} questions</span><span class="badge">${v.paper.minutes} minutes</span><span class="badge">${v.paper.mode==='jee-advanced'?'JEE Advanced-style':'JEE Main-style'}</span><span class="badge">${v.paper.questions.filter(q=>q.diagramCount).length} questions with diagram markers</span></div>${v.warnings.length?`<ul class="small amber">${v.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${markingSummary(v.paper)}${scoreSettingsControls(v.paper.scoring,'imp-',v.paper.questions,v.paper.sectionScoring)}<div class="row" style="margin-top:12px"><label class="field">Exam interface<select id="mode-override"><option value="jee-main" ${v.paper.mode==='jee-main'?'selected':''}>JEE Main-style CBT</option><option value="jee-advanced" ${v.paper.mode==='jee-advanced'?'selected':''}>JEE Advanced-style CBT</option></select></label></div><div class="row" style="margin-top:12px"><button data-act="save-paper" class="primary">Save to Test Library</button><button data-act="save-start">Save &amp; Start Test</button></div></div>`}
const DEMO={title:'Demo CBT — Basic Physics',durationMinutes:8,mode:'jee-main',scoring:SCORE_DEFAULT,questions:[{id:'DEMO_001',type:'single',subject:'Physics',chapter:'Kinematics',section:'Single Correct',question:'A body is projected vertically upward with speed $20\\,\\text{m s}^{-1}$. Take $g=10\\,\\text{m s}^{-2}$. What maximum height does it reach?',options:['10 m','20 m','30 m','40 m'],correctAnswer:'B',solution:'At the top, $v=0$. Using $v^2=u^2-2gh$, we get $h=u^2/(2g)=400/20=20\\,\\text{m}$. Final answer: (B).'}, {id:'DEMO_002',type:'multiple',subject:'Physics',chapter:'Units',section:'Multiple Correct',question:'Which of the following are scalar quantities? Select all correct options.',options:['Speed','Velocity','Work','Displacement'],correctAnswer:['A','C'],solution:'Speed and work are scalar quantities. Velocity and displacement are vectors.'},{id:'DEMO_003',type:'numerical',subject:'Chemistry',chapter:'Mole Concept',section:'Numerical',question:'How many moles are present in $36\\,\\text{g}$ of water? Molar mass = $18\\,\\text{g mol}^{-1}$.',options:[],correctAnswer:2,solution:'$n=m/M=36/18=2$ mol.'}]};
async function saveValidated(start){const raw=window._validated;if(!raw)return;if(!applyImportedScoring(false))return;const p=structuredClone(raw);p.mode=$('#mode-override')?.value||p.mode;const existing=await DB.get('papers',p.id);if(existing)p.id=uid();await DB.put('papers',p);await refresh();toast('Test saved. Imported section-wise marking rules are active.');if(start)await createActive(p);else goto('#/library')}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;try{
if(a==='toggle-theme'){localStorage.setItem('pcm-cbt-exam-theme',document.body.classList.contains('dark-exam')?'light':'dark');render();}else if(a==='new-import')goto('#/import');else if(a==='route-library')goto('#/library');else if(a==='route-history')goto('#/history');else if(a==='validate'){await validateImport()}else if(a==='apply-scoring'){applyImportedScoring(true)}else if(a==='edit-marking'){viewState.scoringEditId=id;render()}else if(a==='cancel-marking'){delete viewState.scoringEditId;render()}else if(a==='save-marking'){const p=getPaper(id);if(p){try{const config=readScoringSettings('edit-');p.scoring=config.scoring;p.sectionScoring=config.sectionScoring;await DB.put('papers',p);delete viewState.scoringEditId;await refresh();render();toast('Marking settings saved. New attempts will use them.')}catch(err){toast(err.message)}}}else if(a==='clear-source'){$('#source').value='';if($('#source-pdf'))$('#source-pdf').value='';$('#validation').innerHTML='';window._validated=null}else if(a==='fill-sample'){$('#source').value='window.CBT_IMPORT = '+JSON.stringify(DEMO,null,2)+';';$('#validation').innerHTML='';toast('Demo code loaded. Click Validate code.')}else if(a==='copy-prompt')await copyText(PROMPT,'AI-agent instructions copied. Send them with your PDF/pages.');else if(a==='save-paper')await saveValidated(false);else if(a==='save-start')await saveValidated(true);else if(a==='start-paper')await startPaper(id,'exam');else if(a==='practice-paper')await startPaper(id,'practice');else if(a==='delete-paper'){if(confirm('Delete this saved test paper? Existing result history will remain.')){await DB.del('papers',id);await refresh();render();toast('Paper deleted.')}}else if(a==='copy-paper'){const p=getPaper(id);if(p)await copyText(codeFor(p),'Test code copied. Paste it on another device to transfer this paper.')}else if(a==='resume'){if(ACTIVE){ACTIVE.visited=[...new Set([...(ACTIVE.visited||[]),ACTIVE.current])];await saveActive();goto('#/test')}}else if(a==='discard' dexOf(ACTIVE.current);if(pos>=0&&pos<inds.length-1)moveTo(inds[pos+1]);else toast('End of this section. Choose another section or question from the palette.')}else if(a==='previous'){if(ACTIVE.sessionMode==='practice')return;const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);if(pos>0)moveTo(inds[pos-1]);else toast('This is the first question in this section.')}else if(a==='clear'){if(ACTIVE.sessionMode==='practice'&&ACTIVE.checked?.[ACTIVE.paper.questions[ACTIVE.current].id])return;delete ACTIVE.answers[ACTIVE.paper.questions[ACTIVE.current].id];await saveActive();render()}else if(a==='review'){if(ACTIVE.sessionMode==='practice')return;const q=ACTIVE.paper.questions[ACTIVE.current];ACTIVE.marked[q.id]=!ACTIVE.marked[q.id];if(!ACTIVE.marked[q.id])delete ACTIVE.marked[q.id];await saveActive();render()}else if(a==='review-next'){if(ACTIVE.sessionMode==='practice')return;const q=ACTIVE.paper.questions[ACTIVE.current];ACTIVE.marked[q.id]=true;await saveActive();const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);if(pos>=0&&pos<inds.length-1)moveTo(inds[pos+1]);else toast('End of this section. Choose another section or question from the palette.')}else if(a==='filter'){ACTIVE.filter=el.dataset.filter;const inds=visibleIndices();if(!inds.includes(ACTIVE.current))ACTIVE.current=inds[0]||0;ACTIVE.visited=[...new Set([...(ACTIVE.visited||[]),ACTIVE.current])];await saveActive();render()}else if(a==='submit'){const answered=ACTIVE.paper.questions.filter(q=>hasAnswer(ACTIVE.answers[q.id])).length;if(confirm(`Submit this test?\n\nAnswered: ${answered}\nUnanswered: ${ACTIVE.paper.questions.length-answered}`))await submitTest(false)}else if(a==='resume-home'){if(ACTIVE.sessionMode==='practice'){if(confirm('Exit practice? Your progress in this practice session will be discarded.')){await DB.del('meta','active');ACTIVE=null;goto('#/home')}}else if(confirm('Exit the test screen? Your active attempt will be saved and the timer will keep running.'))goto('#/home')}els
