<header><div class="headin"><div class="brand"><b>▮</b> PCM CBT <span class="muted" style="font-weight:400">/ PRACTICE LAB</span></div><nav id="nav"><a href="#/home" data-route="home">Dashboard</a><a href="#/library" data-route="library">Test Library</a><a href="#/import" data-route="import">Paste Test Code</a><a href="#/history" data-route="history">Test History</a></nav><a class="homelink" href="index.html">← JEE 2027 home</a></div></header>
<main id="app"><div class="empty">Loading CBT…</div></main><div class="toast" id="toast"></div>
<script>
'use strict';
const SCORE_DEFAULT={correct:4,wrong:-1,unattempted:0};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const stamp=()=>new Date().toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const shortDate=ts=>new Date(ts).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
const fmtTime=s=>`${pad(Math.floor(Math.max(0,s)/60))}:${pad(Math.floor(Math.max(0,s)%60))}`;
const uid=()=>`TEST-${new Date().toISOString().slice(0,10)}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
let toastTimer;function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3800)}
function mathify(root=document){try{if(window.renderMathInElement)renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch{}}
function markedText(s){let x=esc(s||'');return x.replace(/\[(SEE DIAGRAM[^\]]*)\]/gi,'<span class="diagram">$1</span>');}
const PROMPT=`Convert ONLY the supplied PDF or specified PDF pages into a test for my personal PCM CBT website. Do not create new questions and do not paraphrase or alter question statements, numerical values, options, symbols, or answer choices. Return ONLY JavaScript in this exact wrapper: window.CBT_IMPORT = { ... }; Use JSON-compatible syntax: double-quoted keys and strings, no comments, no trailing commas, no functions, no undefined values, and escape newlines inside strings.\n\nREQUIRED TOP-LEVEL FORMAT:\nwindow.CBT_IMPORT = {\n  "title": "Physics — Chapter Test",\n  "durationMinutes": 60,\n  "mode": "jee-main",\n  "scoring": {"correct": 4, "wrong": -1, "unattempted": 0},\n  "questions": [\n    {"id":"EXT_001","type":"single","subject":"Physics","chapter":"Thermodynamics","section":"Single Correct","question":"Exact question text","options":["Option A","Option B","Option C","Option D"],"correctAnswer":"B","solution":null}\n  ]\n};\n\nRULES:\n1. Every question must exist in the supplied source. Include only the requested range/count. Give every question a unique id (EXT_001, EXT_002, ...).\n2. Allowed types: "single" (one correct choice), "multiple" (one or more correct choices), and "numerical" (typed numerical answer). For single/multiple questions preserve all choices exactly. Answers must be provided: use "A"/"B"/"C"/"D" for single; an array such as ["A","C"] for multiple; a number for numerical. Do not guess; carefully solve if the source has no key.\n3. Keep subject as exactly "Physics", "Chemistry", or "Mathematics" when identifiable. Add chapter and section labels if known. Use "mode": "jee-main" or "jee-advanced".\n4. NO embedded pictures, base64, image arrays, or image URLs. To save tokens, wherever a diagram, figure, graph, circuit, table-as-image, or photo is needed to understand a question, place a marker at the relevant point in the question string in this exact format: [SEE DIAGRAM — PDF page 3, Question 12]. Use the actual PDF page number and printed question number. Keep all accompanying textual information. Do not attempt to describe or redraw the diagram. The marker is a reminder for me to look at the original PDF separately.\n5. Preserve maths/chemistry notation with readable Unicode or LaTeX ($...$). Keep paragraphs/passages in the question string. If questions share a common passage, include the passage in each dependent question so each can stand alone.\n6. If the PDF contains a verified solution, preserve it in "solution". Otherwise use null; do not waste tokens on solutions unless I request them.\n7. Matrix-match questions: represent the prompt and both columns clearly in the question text, preserve the original response options if present, and encode each available response as a selectable choice. Do not invent options. If the source has no selectable response options and it cannot be faithfully represented with the supported formats, tell me instead of fabricating a format.\n8. Check the count, ids, answer mapping and syntax before returning. Output no explanation outside the code.`;

// IndexedDB is local to this browser/device. No account, server, or Gemini API is used.
const dbp=new Promise((resolve,reject)=>{const req=indexedDB.open('pcm-cbt-static-v2',1);req.onupgradeneeded=()=>{const d=req.result;for(const s of ['papers','attempts','meta'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
function dbReq(store,mode,fn){return dbp.then(d=>new Promise((resolve,reject)=>{const tx=d.transaction(store,mode),req=fn(tx.objectStore(store));tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)}))}
const DB={all:s=>dbReq(s,'readonly',st=>st.getAll()),get:(s,id)=>dbReq(s,'readonly',st=>st.get(id)),put:(s,o)=>dbReq(s,'readwrite',st=>st.put(o)),del:(s,id)=>dbReq(s,'readwrite',st=>st.delete(id)),clear:s=>dbReq(s,'readwrite',st=>st.clear())};
let PAPERS=[],ATTEMPTS=[],ACTIVE=null,viewState={};
async function refresh(){[PAPERS,ATTEMPTS]=await Promise.all([DB.all('papers'),DB.all('attempts')]);PAPERS.sort((a,b)=>b.createdAt-a.createdAt);ATTEMPTS.sort((a,b)=>b.submittedAt-a.submittedAt);ACTIVE=(await DB.get('meta','active'))?.value||null}
function parseSource(source){let s=String(source||'').trim().replace(/^```(?:javascript|js|json)?\s*/i,'').replace(/\s*```$/,'').trim();s=s.replace(/^(?:window\s*\.\s*CBT_IMPORT|(?:const|let|var)\s+CBT_IMPORT)\s*=\s*/,'').replace(/;\s*$/,'').trim();try{return JSON.parse(s)}catch(e){throw new Error('Could not parse the code. Use window.CBT_IMPORT = { ... }; with JSON-compatible syntax and double-quoted keys/strings. Details: '+e.message)}}
function normalizeSubject(s){const x=String(s||'').toLowerCase();if(x.startsWith('phys'))return 'Physics';if(x.startsWith('chem'))return 'Chemistry';if(x.startsWith('math'))return 'Mathematics';return s?String(s):'General'}
function toIndex(v,n){if(typeof v==='number'&&Number.isInteger(v))return v;if(/^\d+$/.test(String(v).trim()))return Number(v);if(/^[A-F]$/i.test(String(v).trim()))return String(v).trim().toUpperCase().charCodeAt(0)-65;return -1}
function normalizePaper(raw){const errors=[],warnings=[];if(!raw||typeof raw!=='object')return {errors:['The pasted value is not an object.']};if(typeof raw.title!=='string'||!raw.title.trim())errors.push('Add a non-empty title.');const minutes=Number(raw.durationMinutes);if(!Number.isFinite(minutes)||minutes<1||minutes>600)errors.push('durationMinutes must be between 1 and 600.');if(!Array.isArray(raw.questions)||!raw.questions.length)return {errors:[...errors,'questions must be a non-empty array.']};const scoring={...SCORE_DEFAULT,...(raw.scoring||{})};for(const k of ['correct','wrong','unattempted'])if(typeof scoring[k]!=='number'||!Number.isFinite(scoring[k]))errors.push(`scoring.${k} must be numeric.`);const ids=new Set(),questions=[];
raw.questions.forEach((q,i)=>{const n=i+1,err=m=>errors.push(`Question ${n}: ${m}`);if(!q||typeof q!=='object'){err('must be an object.');return}const id=String(q.id||'').trim();if(!id)err('missing id.');else if(ids.has(id))err(`duplicate id "${id}".`);ids.add(id);let type=String(q.type||'').toLowerCase();type=({'single-choice':'single',mcq:'single','multiple-correct':'multiple',multi:'multiple',integer:'numerical',numeric:'numerical'}[type]||type);if(!['single','multiple','numerical'].includes(type)){err('type must be single, multiple, or numerical.');return}const question=String(q.question??q.text??q.questionContent??'');if(!question.trim())err('question text is missing.');const options=Array.isArray(q.options)?q.options.map(v=>String(v)):[];if(type!=='numerical'&&(options.length<2||options.length>8))err('needs 2–8 options.');let answer=null;const sourceAnswer=q.correctAnswer??q.answer;if(sourceAnswer==null||sourceAnswer===''||(Array.isArray(sourceAnswer)&&!sourceAnswer.length))err('correctAnswer is missing.');else if(type==='numerical'){answer=Number(sourceAnswer);if(!Number.isFinite(answer))err('numerical correctAnswer must be a number.')}else{const vals=(Array.isArray(sourceAnswer)?sourceAnswer:[sourceAnswer]).map(v=>toIndex(v,options.length));if(vals.some(v=>v<0||v>=options.length))err('correctAnswer does not match the options. Use letters A–H or zero-based indexes.');else if(type==='single'&&vals.length!==1)err('single type must have exactly one correct choice.');else if(type==='multiple'&&new Set(vals).size!==vals.length)err('multiple correctAnswer contains duplicates.');else answer=type==='single'?vals[0]:[...new Set(vals)].sort((a,b)=>a-b)}const notes=[...question.matchAll(/\[SEE DIAGRAM[^\]]*\]/gi)].length;questions.push({id,question,options,type,subject:normalizeSubject(q.subject),chapter:String(q.chapter||''),section:String(q.section||q.sectionTitle||q.chapter||normalizeSubject(q.subject)),correctAnswer:answer,solution:q.solution==null||q.solution===''?null:String(q.solution),tolerance:Number.isFinite(Number(q.tolerance))?Number(q.tolerance):0.01,diagramCount:notes,questionNumber:i+1})});if(raw.questions.length>300)warnings.push('Large test: '+raw.questions.length+' questions.');if(questions.some(q=>q.type==='multiple'))warnings.push('Multiple-correct questions are marked correct only when every correct option, and no incorrect option, is selected.');if(questions.some(q=>q.diagramCount))warnings.push(`${questions.reduce((n,q)=>n+q.diagramCount,0)} diagram placeholder(s) found. Keep the source PDF open separately while taking this test.`);return {errors,warnings,paper:{id:uid(),title:raw.title,minutes,mode:raw.mode==='jee-advanced'?'jee-advanced':'jee-main',scoring,questions,createdAt:Date.now(),source:'pasted-code'}}}
function getPaper(id){return PAPERS.find(p=>p.id===id)}
function fmtScore(result){return `${result.score} / ${result.maxScore}`}
function computeResult(active,endedAt=Date.now()){const p=active.paper;let correct=0,wrong=0,unanswered=0,ungraded=0;const rows=p.questions.map((q,i)=>{const given=active.answers[q.id],has=given!==undefined&&given!==null&&given!==''&&!(Array.isArray(given)&&!given.length);let status;if(!has){status='unanswered';unanswered++}else if(q.correctAnswer==null){status='ungraded';ungraded++}else{let ok=false;if(q.type==='multiple')ok=Array.isArray(given)&&JSON.stringify([...given].sort((a,b)=>a-b))===JSON.stringify([...q.correctAnswer].sort((a,b)=>a-b));else if(q.type==='numerical')ok=Number.isFinite(Number(given))&&Math.abs(Number(given)-Number(q.correctAnswer))<=q.tolerance;else ok=Number(given)===Number(q.correctAnswer);if(ok){status='correct';correct++}else{status='wrong';wrong++}}return {id:q.id,index:i,answer:has?given:null,status,correctAnswer:q.correctAnswer}});const graded=correct+wrong+unanswered,score=correct*p.scoring.correct+wrong*p.scoring.wrong+unanswered*p.scoring.unattempted,max=graded*p.scoring.correct,answered=correct+wrong+ungraded;return {rows,summary:{total:p.questions.length,correct,wrong,unanswered,ungraded,answered,score,max,accuracy:pct(correct,correct+wrong),percentage:pct(score,max),durationSeconds:Math.max(0,Math.min(endedAt,active.endAt)-active.startedAt)/1000},endedAt}}

 class="badge">Single correct</span><span class="badge">Multiple correct</span><span class="badge">Numerical / integer</span><span class="badge">Diagram placeholders</span></div><p class="small muted" style="margin-top:12px">Marking defaults to +4 correct, −1 wrong, 0 unanswered. A paper can override these values if specified in its code.</p></section><section class="card"><h2>Latest result</h2>${last?`<div class="eyebrow">${shortDate(last.submittedAt)}</div><h1 style="font-family:var(--mono)">${fmtScore(last.result.summary)}</h1><p class="muted">${esc(last.paperTitle)} · ${last.result.summary.percentage}% of max score</p><button data-act="view-result" data-id="${esc(last.id)}">View result</button>`:`<div class="empty">No completed attempts yet.</div>`}</section></div><div class="card"><div class="row"><h2 class="spacer">Recent test papers</h2><button data-act="route-library" class="pillbtn">View all</button></div>${PAPERS.length?PAPERS.slice(0,4).map(paperCard).join(''):`<div class="empty">No saved papers yet. Use <b>Paste Test Code</b> to add your first paper.</div>`}</div><div class="notice"><b>Cross-device note:</b> This is a static website. Your saved tests and results stay in this browser/device. Use <b>Copy test code</b> or keep the generated code in your notes to load the same test on another device. Automatic progress sync would require a separate cloud/backend service.</div>`}

function renderTest(){if(!ACTIVE)return '<div class="card empty">No active test.</div>';document.body.classList.add('exam');const p=ACTIVE.paper,q=p.questions[ACTIVE.current],answer=ACTIVE.answers[q.id],options=q.options||[],filter=ACTIVE.filter||'All',filters=['All',...new Set(p.questions.map(q=>q.subject).filter(Boolean)),...new Set(p.questions.map(q=>q.section).filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i);const isMulti=q.type==='multiple';let ansHTML='';if(q.type==='numerical')ansHTML=`<label class="field" style="max-width:320px;color:#4c5a6c">Numerical answer<input id="num-answer" class="number-input" type="number" step="any" value="${esc(answer??'')}" placeholder="Enter numerical value"></label>`;else ansHTML=options.map((opt,i)=>{const selected=isMulti?(answer||[]).includes(i):Number(answer)===i;return `<button class="option ${selected?'selected':''}" data-act="option" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${markedText(opt)}</span></button>`}).join('');const rem=Math.max(0,Math.ceil((ACTIVE.endAt-Date.now())/1000));const visible=visibleIndices(),curPos=visible.indexOf(ACTIVE.current);return `<div class="exam-topline card" style="padding:11px 14px;margin-bottom:10px;background:#173d78;color:#fff;border-color:#173d78"><div class="row"><div class="exam-title">${esc(p.title)}</div><span>${p.mode==='jee-advanced'?'JEE Advanced-style':'JEE Main-style'}</span><span class="timer" id="timer">${fmtTime(rem)}</span><button class="primary" data-act="submit">Submit Test</button></div></div><div class="exam-shell"><section class="exam-panel"><div class="exam-banner"><div><b>Question ${ACTIVE.current+1} of ${p.questions.length}</b><div class="muted small">Question ID: ${esc(q.id)}</div></div><div class="spacer"></div><span class="badge">${esc(q.type==='single'?'Single correct':q.type==='multiple'?'Multiple correct':'Numerical')}</span>${q.subject?`<span class="badge">${esc(q.subject)}</span>`:''}</div><div class="section-tabs">${ function render(){const route=(location.hash.slice(2).split('/')[0]||'home'),arg=decodeURIComponent(location.hash.slice(2).split('/').slice(1).join('/'));if(route==='test'&&ACTIVE){document.body.classList.add('exam');document.body.classList.toggle('advanced',ACTIVE.paper.mode==='jee-advanced');$('#app').innerHTML=renderTest();mathify($('#app'));tick();return}else {document.body.classList.remove('exam');document.body.classList.remove('advanced')}let html;switch(route){case'import':html=importView();break;case'library':html=libraryView();break;case'history':html=historyView();break;case'result':html=resultView(arg);break;default:html=homeView()}$('#app').innerHTML=html;$$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===route));mathify($('#app'))}

async function startWithFilter(){if(!ACTIVE)return;const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);moveTo(pos>=0?inds[Math.min(inds.length-1,pos+1)]:inds[0]||0)}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;try{
if(a==='new-import')goto('#/import');else if(a==='route-library')goto('#/library');else if(a==='route-history')goto('#/history');else if(a==='validate'){showValidation(normalizePaper(parseSource($('#source').value)))}else if(a==='clear-source'){$('#source').value='';$('#validation').innerHTML='';window._validated=null}else if(a==='fill-sample'){$('#source').value='window.CBT_IMPORT = '+JSON.stringify(DEMO,null,2)+';';$('#validation').innerHTML='';toast('Demo code loaded. Click Validate code.')}else if(a==='copy-prompt')await copyText(PROMPT,'AI-agent instructions copied. Send them with your PDF/pages.');else if(a==='save-paper')await saveValidated(false);else if(a==='save-start')await saveValidated(true);else if(a==='start-paper')await startPaper(id);else if(a==='delete-paper'){if(confirm('Delete this saved test paper? Existing result history will remain.')){await DB.del('papers',id);await refresh();render();toast('Paper deleted.')}}else if(a==='copy-paper'){const p=getPaper(id);if(p)await copyText(codeFor(p),'Test code copied. Paste it on another device to transfer this paper.')}else if(a==='resume'){if(ACTIVE){ACTIVE.visited=[...new Set([...(ACTIVE.visited||[]),ACTIVE.current])];await saveActive();goto('#/test')}}else if(a==='discard'){if(confirm('Discard the unfinished attempt? Its answers will be lost.')){await DB.del('meta','active');ACTIVE=null;render()}}else if(a==='goq'){moveTo(+el.dataset.i)}else if(a==='option'){const q=ACTIVE.paper.questions[ACTIVE.current],i=+el.dataset.i;if(q.type==='multiple'){const s=new Set(ACTIVE.answers[q.id]||[]);s.has(i)?s.delete(i):s.add(i);ACTIVE.answers[q.id]=[...s].sort((a,b)=>a-b)}else ACTIVE.answers[q.id]=i;await saveActive();render()}else if(a==='next'){const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);if(pos>=0&&pos<inds.length-1)moveTo(inds[pos+1]);else toast('End of this section. Choose another section or question from the palette.')}else if(a==='previous'){const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);if(pos>0)moveTo(inds[pos-1]);else toast('This is the first question in this section.')}else if(a==='clear'){delete ACTIVE.answers[ACTIVE.paper.questions[ACTIVE.current].id];await saveActive();render()}else if(a==='review'){const q=ACTIVE.paper.questions[ACTIVE.current];ACTIVE.marked[q.id]=!ACTIVE.marked[q.id];if(!ACTIVE.marked[q.id])delete ACTIVE.marked[q.id];await saveActive();render()}else if(a==='review-next'){const q=ACTIVE.paper.questions[ACTIVE.current];ACTIVE.marked[q.id]=true;await saveActive();const inds=visibleIndices(),pos=inds.indexOf(ACTIVE.current);if(pos>=0&&pos<inds.length-1)moveTo(inds[pos+1]);else toast('End of this section. Choose another section or question from the palette.')}else if(a==='filter'){ACTIVE.filter=el.dataset.filter;const inds=visibleIndices();if(!inds.includes(ACTIVE.current))ACTIVE.current=inds[0]||0;ACTIVE.visited=[...new Set([...(ACTIVE.visited||[]),ACTIVE.current])];await saveActive();render()}else if(a==='submit'){const answered=ACTIVE.paper.questions.filter(q=>hasAnswer(ACTIVE.answers[q.id])).length;if(confirm(`Submit this test?\n\nAnswered: ${answered}\nUnanswered: ${ACTIVE.paper.questions.length-answered}`))await submitTest(false)}else if(a==='resume-home'){if(confirm('Exit the test screen? Your active attempt will be saved and the timer will keep running.'))goto('#/home')}else if(a==='view-result')goto('#/result/'+encodeURIComponent(id));else if(a==='clear-history'){if(confirm('Delete all local test history?')){await DB.clear('attempts');await refresh();render()}}else if(a==='export-history'){const blob=new Blob([JSON.stringify(ATTEMPTS,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='pcm-cbt-history.json';link.click();URL.revokeObjectURL(u)}
}catch(err){console.error(err);toast(err.message||'Something went wrong.')} });
document.addEventListener('input',e=>{if(e.target.id==='source'){window._validated=null;const v=$('#validation');if(v)v.innerHTML='<p class="muted small">Code changed. Validate it again before saving.</p>'}if(e.target.id==='num-answer'&&ACTIVE){const q=ACTIVE.paper.questions[ACTIVE.current],v=e.target.value;if(v.trim()==='')delete ACTIVE.answers[q.id];else ACTIVE.answers[q.id]=v;saveActive()}});
document.addEventListener('change',e=>{if(e.target.id==='num-answer'&&ACTIVE)render()});
document.addEventListener('keydown',e=>{if(!ACTIVE||!document.body.classList.contains('exam')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')document.querySelector('[data-act="next"]')?.click();if(e.key==='ArrowLeft')document.querySelector('[data-act="previous"]')?.click();});
window.addEventListener('hashchange',()=>render());window.addEventListener('beforeunload',()=>{if(ACTIVE)saveActive()});
(async()=>{try{await refresh();if(ACTIVE&&Date.now()>=ACTIVE.endAt)await submitTest(true);else if(ACTIVE)ACTIVE.visited=[...new Set([...(ACTIVE.visited||[]),ACTIVE.current])];await render()}catch(e){console.error(e);$('#app').innerHTML='<div class="card">Could not open local CBT storage. Try a current browser and reload.</div>'}})();
</script>
</body></html>
