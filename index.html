<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JEE 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;height:100vh;
  background:#060608;
  color:#e8e8e0;
  font-family:'DM Mono',monospace;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size:256px 256px;
  pointer-events:none;z-index:0;opacity:0.6;
}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:900px;
  padding:0 32px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.countdowns{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  width:100%;
  animation:fadeIn 1.2s ease both;
}

.divider-v{
  background:linear-gradient(180deg,transparent,#ffffff18,transparent);
  align-self:stretch;
}

.countdown{
  padding:24px 32px;
  display:flex;flex-direction:column;
  align-items:center;gap:14px;
}

.exam-label{
  font-size:10px;
  font-weight:300;
  letter-spacing:5px;
  text-transform:uppercase;
  color:#666;
}

.exam-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,5vw,3.4rem);
  letter-spacing:3px;
  line-height:1;
  color:#e8e8e0;
}

.exam-date{
  font-size:10px;
  letter-spacing:3px;
  color:#444;
  font-weight:300;
}

.segments{
  display:flex;
  gap:12px;
  align-items:flex-end;
}

.seg{
  display:flex;flex-direction:column;
  align-items:center;gap:6px;
}

.seg-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.8rem,6vw,5rem);
  line-height:1;
  color:#e8e8e0;
  min-width:2ch;
  text-align:center;
  transition:color 0.3s;
}

.seg-num.tick{color:#fff;}

.seg-unit{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#3a3a3a;
  font-weight:300;
}

.seg-sep{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.2rem,5vw,4rem);
  color:#222;
  margin-bottom:14px;
  line-height:1;
}

.countdown.urgent .seg-num{color:#c0392b;}
.countdown.urgent .exam-name{color:#e87070;}

.progress-wrap{
  width:100%;height:1px;
  background:#1a1a1a;
  border-radius:1px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#2a2a2a,#666);
  border-radius:1px;
  transition:width 1s linear;
}

.btn-wrap{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:10;
  animation:fadeInBtn 1.5s 0.4s ease both;
  opacity:0;
}

.tracker-btn{
  background:transparent;
  border:0.5px solid #2a2a2a;
  color:#444;
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  padding:10px 24px;
  border-radius:40px;
  cursor:pointer;
  text-decoration:none;
  display:block;
  transition:border-color 0.2s,color 0.2s;
}
.tracker-btn:hover{border-color:#555;color:#aaa;}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeInBtn{
  from{opacity:0;}
  to{opacity:1;}
}

@media(max-width:600px){
  .countdowns{grid-template-columns:1fr;grid-template-rows:auto 1px auto;}
  .divider-v{width:100%;height:1px;background:linear-gradient(90deg,transparent,#ffffff18,transparent);}
  .countdown{padding:20px 16px;}
  .seg-num{font-size:2.8rem;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="countdowns">

    <div class="countdown" id="cd-mains">
      <div class="exam-label">Countdown to</div>
      <div class="exam-name">JEE Mains</div>
      <div class="exam-date">21 · 01 · 2027</div>
      <div class="segments">
        <div class="seg"><div class="seg-num" id="m-days">000</div><div class="seg-unit">Days</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="m-hrs">00</div><div class="seg-unit">Hours</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="m-min">00</div><div class="seg-unit">Mins</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="m-sec">00</div><div class="seg-unit">Secs</div></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="m-prog"></div></div>
    </div>

    <div class="divider-v"></div>

    <div class="countdown" id="cd-adv">
      <div class="exam-label">Countdown to</div>
      <div class="exam-name">JEE Advanced</div>
      <div class="exam-date">10 · 05 · 2027</div>
      <div class="segments">
        <div class="seg"><div class="seg-num" id="a-days">000</div><div class="seg-unit">Days</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="a-hrs">00</div><div class="seg-unit">Hours</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="a-min">00</div><div class="seg-unit">Mins</div></div>
        <div class="seg-sep">:</div>
        <div class="seg"><div class="seg-num" id="a-sec">00</div><div class="seg-unit">Secs</div></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="a-prog"></div></div>
    </div>

  </div>
</div>

<div class="btn-wrap">
  <a href="jee-tracker.html" class="tracker-btn">score tracker →</a>
</div>

<div style="display:none;">

<!-- end freedns banner code -->
</div>

<script>
const MAINS = new Date('2027-01-21T00:00:00');
const ADV   = new Date('2027-05-10T00:00:00');
const START = new Date('2026-06-01T00:00:00');

function pad(n,len=2){return String(Math.max(0,n)).padStart(len,'0');}

function update(target,daysId,hrsId,minId,secId,progId,wrapId){
  const now=new Date();
  const diff=target-now;
  if(diff<=0){
    [daysId,hrsId,minId,secId].forEach(id=>document.getElementById(id).textContent='00');
    document.getElementById(progId).style.width='100%';
    return;
  }
  const days=Math.floor(diff/86400000);
  const hrs=Math.floor((diff%86400000)/3600000);
  const mins=Math.floor((diff%3600000)/60000);
  const secs=Math.floor((diff%60000)/1000);

  const secEl=document.getElementById(secId);
  secEl.textContent=pad(secs);
  secEl.classList.add('tick');
  setTimeout(()=>secEl.classList.remove('tick'),150);

  document.getElementById(daysId).textContent=pad(days,3);
  document.getElementById(hrsId).textContent=pad(hrs);
  document.getElementById(minId).textContent=pad(mins);

  const pct=Math.min(100,Math.max(0,((now-START)/(target-START))*100));
  document.getElementById(progId).style.width=pct+'%';

  if(days<30)document.getElementById(wrapId).classList.add('urgent');
  else document.getElementById(wrapId).classList.remove('urgent');
}

function tick(){
  update(MAINS,'m-days','m-hrs','m-min','m-sec','m-prog','cd-mains');
  update(ADV,  'a-days','a-hrs','a-min','a-sec','a-prog','cd-adv');
}

tick();
setInterval(tick,1000);
</script>
</body>
</html>
